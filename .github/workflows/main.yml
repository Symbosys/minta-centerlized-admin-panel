name: Minta Fresh & Minta Restro Admin Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mintafresh/restro-fresh-admin:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "pulling latest docker image"
            sudo docker pull mintafresh/restro-fresh-admin:latest

            echo "Navigating to minta-club/restro-fresh-admin directory..."
            cd /root/minta-club/restro-fresh-admin

            echo "Rebuilding and restarting services..." 
            sudo docker compose up -d 

            echo "Deployment successful ✅"

            echo "Cleaning up..."
            sudo docker system prune -f
